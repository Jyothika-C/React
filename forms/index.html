<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form</title>
</head>
<body>

    <h2>Form Events</h2>

    <form action="" id="form">
        <label for="name">Name:</label>
        <input type="text" name="name" id="name4" value="user_default" >
        <br><br>

        <label for="email">Email:</label>
        <input 
            type="email" 
            name="email"
            id="email" 
             
            value="user_default@gmail.com" 
            
        >
        <br><br>

        <button type="submit">Submit</button>
    </form>
    <script src="script.js"></script>

</body>
</html>
